plugins {
	id 'net.minecraftforge.gradle' version '[5.1,5.2)'
	id 'eclipse'
	id 'maven-publish'
}

version = "${mod_version}+mc${minecraft_version}"
group = "com.madgique"
archivesBaseName = "advanced-xray"

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
	mappings channel: mappings_channel, version: mappings_version

	runs {
		client {
			workingDirectory project.file('run')

			property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
			property 'forge.logging.console.level', 'debug'
		}

		server {
			property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
			property 'forge.logging.console.level', 'debug'
		}
	}
}

dependencies {
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

jar {
	manifest {
		attributes([
				"Specification-Title": "Advanced XRay",
				"Specification-Vendor": "Madgique",
				"Specification-Version": "1",
				"Implementation-Title": project.name,
				"Implementation-Version": "${version}",
				"Implementation-Vendor": "Madgique",
				"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "mcversion", project.minecraft_version

	filesMatching('mcmod.info') {
		expand 'version': project.version, 'mcversion': project.minecraft_version
	}
}

jar.finalizedBy('reobfJar')

publishing {
	publications {
		mavenJava(MavenPublication) {
			groupId project.group
			artifactId project.archivesBaseName
			version project.version

			artifact jar
		}
	}
}
